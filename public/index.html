<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Manager</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>📚 Book Manager</h1>
            <p>Manage your favorite books with a simple REST API.</p>
        </header>

        <section class="form-section">

            <input
                type="text"
                id="title"
                placeholder="Book Title"
            >

            <input
                type="text"
                id="author"
                placeholder="Author Name"
            >

            <button id="addBtn">
                Add Book
            </button>

        </section>

        <section id="bookList" class="book-list">

        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
